# Builds the release APK to prove the code still compiles and shrinks. Runs on every pull request
# and push, and is called by update-components.yml before it opens a pull request.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Fetch source repositories
        uses: ./.github/actions/fetch-submodules

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileRelease
