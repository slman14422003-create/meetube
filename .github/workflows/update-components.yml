# Keeps the parts that change under the app current: MediaServiceCore (the YouTube backend, the
# piece that breaks when YouTube changes) and SharedModules. Every week (or on demand) it looks
# for newer commits, builds them, and opens a pull request only if the build passes. Merge the
# pull request, then run "Release" to ship it.
#
# One-time setting: Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests".
name: Update components

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.pins.outputs.changed }}
      summary: ${{ steps.pins.outputs.summary }}
      msc: ${{ steps.pins.outputs.msc }}
      sm: ${{ steps.pins.outputs.sm }}
      msc_sm: ${{ steps.pins.outputs.msc_sm }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Look for newer commits
        id: pins
        run: |
          set -euo pipefail
          source .github/submodule-pins.env
          latest() { git ls-remote "$1" HEAD | cut -f1; }
          new_msc=$(latest "$MEDIASERVICECORE_URL")
          new_sm=$(latest "$SHAREDMODULES_URL")
          # MediaServiceCore's nested SharedModules is whatever the new MediaServiceCore commit points at.
          new_msc_sm=$MSC_SHAREDMODULES_SHA
          if [ "$new_msc" != "$MEDIASERVICECORE_SHA" ]; then
            tmp=$(mktemp -d)
            git -C "$tmp" init -q
            git -C "$tmp" fetch -q --depth=1 "$MEDIASERVICECORE_URL" "$new_msc"
            new_msc_sm=$(git -C "$tmp" ls-tree FETCH_HEAD SharedModules | awk '{print $3}')
            [ -n "$new_msc_sm" ] || new_msc_sm=$MSC_SHAREDMODULES_SHA
          fi
          sed -i "s/^MEDIASERVICECORE_SHA=.*/MEDIASERVICECORE_SHA=$new_msc/" .github/submodule-pins.env
          sed -i "s/^SHAREDMODULES_SHA=.*/SHAREDMODULES_SHA=$new_sm/" .github/submodule-pins.env
          sed -i "s/^MSC_SHAREDMODULES_SHA=.*/MSC_SHAREDMODULES_SHA=$new_msc_sm/" .github/submodule-pins.env
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Everything is current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "- MediaServiceCore: \`${MEDIASERVICECORE_SHA:0:7}\` -> \`${new_msc:0:7}\`"
            echo "- SharedModules: \`${SHAREDMODULES_SHA:0:7}\` -> \`${new_sm:0:7}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "msc=$new_msc"
            echo "sm=$new_sm"
            echo "msc_sm=$new_msc_sm"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use the new pins
        env:
          MSC: ${{ needs.check.outputs.msc }}
          SM: ${{ needs.check.outputs.sm }}
          MSC_SM: ${{ needs.check.outputs.msc_sm }}
        run: |
          sed -i "s/^MEDIASERVICECORE_SHA=.*/MEDIASERVICECORE_SHA=$MSC/" .github/submodule-pins.env
          sed -i "s/^SHAREDMODULES_SHA=.*/SHAREDMODULES_SHA=$SM/" .github/submodule-pins.env
          sed -i "s/^MSC_SHAREDMODULES_SHA=.*/MSC_SHAREDMODULES_SHA=$MSC_SM/" .github/submodule-pins.env

      - name: Fetch source repositories
        uses: ./.github/actions/fetch-submodules

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with the new commits
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileRelease --stacktrace

  pull-request:
    needs: [check, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Open the pull request
        env:
          SUMMARY: ${{ needs.check.outputs.summary }}
          MSC: ${{ needs.check.outputs.msc }}
          SM: ${{ needs.check.outputs.sm }}
          MSC_SM: ${{ needs.check.outputs.msc_sm }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sed -i "s/^MEDIASERVICECORE_SHA=.*/MEDIASERVICECORE_SHA=$MSC/" .github/submodule-pins.env
          sed -i "s/^SHAREDMODULES_SHA=.*/SHAREDMODULES_SHA=$SM/" .github/submodule-pins.env
          sed -i "s/^MSC_SHAREDMODULES_SHA=.*/MSC_SHAREDMODULES_SHA=$MSC_SM/" .github/submodule-pins.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/update-components
          git add .github/submodule-pins.env
          git commit -m "Update MediaServiceCore and SharedModules"
          git push --force origin auto/update-components
          body=$(printf 'Newer upstream commits. The app built with them (CI passed).\n\n%s\n\nMerge, then run **Release** to ship it.' "$SUMMARY")
          if gh pr view auto/update-components >/dev/null 2>&1; then
            gh pr edit auto/update-components --body "$body"
          else
            if ! gh pr create --head auto/update-components --base "$BASE" \
                --title "Update MediaServiceCore and SharedModules" --body "$body"; then
              # The repository forbids Actions from opening pull requests. The branch is pushed and
              # already built, so say where to open it by hand instead of failing the run.
              link="https://github.com/${{ github.repository }}/compare/$BASE...auto/update-components?expand=1"
              echo "::warning::Could not open the pull request. Open it here: $link"
              {
                echo "### The update is ready on branch \`auto/update-components\`"
                echo
                echo "[Open the pull request]($link)"
                echo
                echo "To open it automatically next time: Settings > Actions > General > Workflow permissions > tick *Allow GitHub Actions to create and approve pull requests*."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
