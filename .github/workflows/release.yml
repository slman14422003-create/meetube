# Builds the signed MeeTube APKs.
# - Push a tag vX.Y.Z (matching build.gradle's stmobile versionName "X.Y.Z Name" and the top
#   CHANGELOG.md entry): publishes the GitHub release "MeeTube X.Y.Z Name" with the APKs and
#   meetube.json for the in-app updater. Its notes are a download table, then the changelog entry.
# - Run it by hand (Actions > Release > Run workflow): type the version you want (for example
#   "3.7.0 Nova"; the code is worked out from the number unless you give one). It builds with that
#   version and keeps the APKs as artifacts; tick "publish" to also create the GitHub release
#   vX.Y.Z (no meetube.json, so the in-app updater is untouched).
# Secrets (optional on a fork - without them the APKs are debug-signed): SIGNING_KEY (the .jks, base64), KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD. Every release
# must use the same key or installed apps refuse the update.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version, e.g. "3.7.0 Nova" (empty = keep build.gradle as is)'
        required: false
        type: string
      version_code:
        description: 'Version code (empty = worked out from the number: 3.7.0 -> 30700)'
        required: false
        type: string
      publish:
        description: 'Also publish a GitHub release with this version'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      # The repo was uploaded without its submodule links (empty MediaServiceCore/ and SharedModules/),
      # so checkout cannot fetch them. Clone them here at the commits the project was built with.
      - name: Fetch submodules if missing
        run: |
          fetch() { # dir url sha
            if [ -f "$1/core_settings.gradle" ]; then return 0; fi
            rm -rf "$1"; mkdir -p "$1"
            git -C "$1" init -q
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch -q --depth=1 origin "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch SharedModules https://github.com/yashoncode/SharedModules 5df06e82c76f76301307f293838b1bd6678560a1
          fetch MediaServiceCore https://github.com/yashoncode/MediaServiceCore b83d2952a44664f8932726ef3b0811da63a594f1
          # MediaServiceCore carries its own SharedModules submodule.
          if [ ! -f MediaServiceCore/SharedModules/core_settings.gradle ]; then
            rm -rf MediaServiceCore/SharedModules
            git clone -q https://github.com/yuliskov/SharedModules MediaServiceCore/SharedModules
            git -C MediaServiceCore/SharedModules checkout -q 17ea42b685b6196f22e5292f9ce121dc93207e14
          fi
          ls SharedModules/core_settings.gradle MediaServiceCore/core_settings.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.version_name != ''
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          name = os.environ["VERSION_NAME"].strip()
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)(\s.+)?$", name)
          if not m:
              sys.exit("::error::version must look like 3.7.0 or 3.7.0 Nova")
          code = os.environ.get("VERSION_CODE", "").strip() or str(int(m[1]) * 10000 + int(m[2]) * 100 + int(m[3]))
          path = "mobile/build.gradle"
          text = open(path, encoding="utf-8").read()
          # the stmobile flavor's lines are the last ones in the file
          i = text.rindex("versionCode ")
          j = text.rindex("versionName ")
          head, tail = text[:i], text[i:]
          tail = re.sub(r"versionCode \d+", "versionCode " + code, tail, count=1)
          tail = re.sub(r'versionName "[^"]*"', 'versionName "' + name + '"', tail, count=1)
          open(path, "w", encoding="utf-8").write(head + tail)
          print("version set to", name, code)
          PY

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            # No secrets (a fork): the build falls back to the debug key. Fine for testing, but each
            # run signs with a different key, so installing over an older build needs an uninstall first.
            echo "::warning::SIGNING_KEY secret is missing - building with the debug key"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileRelease

      - name: Collect APKs
        id: meta
        run: |
          mkdir dist
          cp mobile/build/outputs/renamed_apks/stmobileRelease/*.apk dist/
          ls -l dist
          # The stmobile flavor's versionName, e.g. "3.2.0 Rebirth" (defaultConfig's comes first).
          echo "name=$(grep -oP 'versionName "\K[0-9]+\.[0-9]+\.[0-9]+[^"]*' mobile/build.gradle | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Keep APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube ${{ steps.meta.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ github.ref_name }}
          NAME: ${{ steps.meta.outputs.name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            TAG="v${NAME%% *}"
          else
            TAG="$REF_TAG"
            # Fails unless the tag, build.gradle and CHANGELOG.md agree on the version.
            python3 tools/update_manifest.py --tag "$TAG" --dist dist --out dist/meetube.json
          fi
          # Release notes: which APK to pick, then this version's CHANGELOG.md section without its heading.
          awk -v h="## $NAME" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            [ "$MANUAL" = "true" ] || { echo "::error::no CHANGELOG.md section for $NAME"; exit 1; }
            echo "Manual build of $NAME." > changes.md
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MeeTube_${TAG#v}"
          # MeeTube TV ships from yashoncode/meetube-tv under tv-vX.Y.Z tags: the newest non-beta one's universal APK.
          tv_repo=yashoncode/meetube-tv
          tv=$(gh release list --repo "$tv_repo" --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("tv-v"))][0] // empty')
          {
            echo "### Download"
            echo
            echo "| Your phone | APK |"
            echo "| :-- | :-- |"
            echo "| **Most phones** | [arm64-v8a](${url}_arm64-v8a.apk) |"
            echo "| **Low end phones** (older or 32-bit) | [armeabi-v7a](${url}_armeabi-v7a.apk) |"
            echo "| **Universal** (not sure? this one works on all) | [universal](${url}_universal.apk) |"
            if [ -n "$tv" ]; then
              echo "| **TV** (Android TV, Google TV, Fire TV) | [universal](https://github.com/$tv_repo/releases/download/$tv/MeeTubeTV_${tv#tv-v}_universal.apk) |"
            fi
            echo
            cat changes.md
          } > notes.md
          gh release create "$TAG" dist/* --title "MeeTube $NAME" --notes-file notes.md --target "$GITHUB_SHA"
