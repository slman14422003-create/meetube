# Builds the signed MeeTube APKs.
# - Push a tag vX.Y.Z (matching build.gradle's stmobile versionName "X.Y.Z Name" and the top
#   CHANGELOG.md entry): publishes the GitHub release "MeeTube X.Y.Z Name" with the APKs and
#   meetube.json for the in-app updater. Its notes are a download table, then the changelog entry.
# - Run it by hand (Actions > Release > Run workflow): type the version you want (for example
#   "4.2.0"; the code is worked out from the number unless you give one). It builds with that
#   version, keeps the APKs as artifacts and, with "publish" ticked (the default), publishes the
#   GitHub release vX.Y.Z with the APKs, SHA256SUMS.txt and meetube.json for the in-app updater.
# Secrets (optional on a fork - without them the APKs are debug-signed): SIGNING_KEY (the .jks, base64), KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD. Every release
# must use the same key or installed apps refuse the update.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version, any form (5.1.1, v5.1.1, 5.1.1 Nova). Empty = the next patch after the latest release'
        required: false
        type: string
      version_code:
        description: 'Version code (empty = worked out from the number: 3.7.0 -> 30700)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub release with the APKs and meetube.json (what the in-app updater reads)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The source repositories are cloned at the commits in .github/submodule-pins.env.
      - name: Fetch source repositories
        uses: ./.github/actions/fetch-submodules

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # By hand the version is set here, whatever was typed ("5.1.1", "v5.1.1", "5.1", "5.1.1 Nova").
      # Empty or unreadable: the next patch after the latest release, so every run is a new update.
      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          raw = os.environ.get("VERSION_NAME", "").strip()
          path = "mobile/build.gradle"
          text = open(path, encoding="utf-8").read()
          i = text.rindex("versionCode ")  # the stmobile flavor's lines are the last ones in the file
          head, tail = text[:i], text[i:]

          def numbers(s):
              m = re.match(r"v?(\d+)\.(\d+)\.(\d+)", s or "")
              return tuple(int(x) for x in m.groups()) if m else None

          try:
              latest = numbers(subprocess.run(
                  ["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/latest", "--jq", ".tag_name"],
                  capture_output=True, text=True, check=True).stdout.strip())
          except Exception:
              latest = None  # no release yet
          base = latest or numbers(re.search(r'versionName "([^"]*)"', tail).group(1)) or (1, 0, 0)

          m = re.match(r"^[vV]?\s*(\d+)(?:\.(\d+))?(?:\.(\d+))?\s*(.*)$", raw)
          if m:
              nums = tuple(int(x or 0) for x in m.groups()[:3])
              suffix = m.group(4).strip()
              if latest and nums <= latest:
                  print("::warning::" + ".".join(map(str, nums)) + " is not newer than the latest release "
                        + ".".join(map(str, latest)) + ": installed apps will not offer it")
          else:
              if raw:
                  print("::warning::could not read the version '" + raw + "', using the next patch")
              nums, suffix = (base[0], base[1], base[2] + 1), ""
          name = ".".join(map(str, nums)) + (" " + suffix if suffix else "")
          code = os.environ.get("VERSION_CODE", "").strip() or str(nums[0] * 10000 + nums[1] * 100 + nums[2])
          tail = re.sub(r"versionCode \d+", "versionCode " + code, tail, count=1)
          tail = re.sub(r'versionName "[^"]*"', 'versionName "' + name + '"', tail, count=1)
          open(path, "w", encoding="utf-8").write(head + tail)
          print("version set to", name, code)
          PY

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            # No secrets (a fork): the build falls back to the debug key. Fine for testing, but each
            # run signs with a different key, so installing over an older build needs an uninstall first.
            echo "::warning::SIGNING_KEY secret is missing - building with the debug key"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileRelease

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        id: meta
        run: |
          mkdir dist
          cp mobile/build/outputs/renamed_apks/stmobileRelease/*.apk dist/
          ls -l dist
          # The stmobile flavor's versionName, e.g. "3.2.0 Rebirth" (defaultConfig's comes first).
          echo "name=$(grep -oP 'versionName "\K[0-9]+\.[0-9]+\.[0-9]+[^"]*' mobile/build.gradle | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Keep APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube ${{ steps.meta.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ github.ref_name }}
          NAME: ${{ steps.meta.outputs.name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            TAG="v${NAME%% *}"
            # The hand-started build also writes meetube.json, or the app would find no update.
            python3 tools/update_manifest.py --manual --tag "$TAG" --dist dist --out dist/meetube.json
          else
            TAG="$REF_TAG"
            # Fails unless the tag, build.gradle and CHANGELOG.md agree on the version.
            python3 tools/update_manifest.py --tag "$TAG" --dist dist --out dist/meetube.json
          fi
          # SHA-256 of every file, so a download can be checked against what was built here.
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # Release notes: which APK to pick, then this version's CHANGELOG.md section without its heading.
          awk -v h="## $NAME" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            [ "$MANUAL" = "true" ] || { echo "::error::no CHANGELOG.md section for $NAME"; exit 1; }
            echo "Manual build of $NAME." > changes.md
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MeeTube_${TAG#v}"
          {
            echo "### Download"
            echo
            echo "| Your phone | APK |"
            echo "| :-- | :-- |"
            echo "| **Most phones** | [arm64-v8a](${url}_arm64-v8a.apk) |"
            echo "| **Low end phones** (older or 32-bit) | [armeabi-v7a](${url}_armeabi-v7a.apk) |"
            echo "| **Universal** (not sure? this one works on all) | [universal](${url}_universal.apk) |"
            echo
            cat changes.md
          } > notes.md
          # Running the same version again replaces its release instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # The update: the APKs and meetube.json go up as the latest release, which the app reads at
          # releases/latest/download/meetube.json.
          gh release create "$TAG" dist/* --title "MeeTube $NAME" --notes-file notes.md --target "$GITHUB_SHA" --latest