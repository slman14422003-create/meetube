name: Fetch source repositories
description: Clones MediaServiceCore and SharedModules at the commits in .github/submodule-pins.env
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        source .github/submodule-pins.env
        fetch() { # dir url sha
          rm -rf "$1"; mkdir -p "$1"
          git -C "$1" init -q
          git -C "$1" remote add origin "$2"
          git -C "$1" fetch -q --depth=1 origin "$3"
          git -C "$1" checkout -q FETCH_HEAD
        }
        fetch SharedModules "$SHAREDMODULES_URL" "$SHAREDMODULES_SHA"
        fetch MediaServiceCore "$MEDIASERVICECORE_URL" "$MEDIASERVICECORE_SHA"
        fetch MediaServiceCore/SharedModules "$MSC_SHAREDMODULES_URL" "$MSC_SHAREDMODULES_SHA"
        ls SharedModules/core_settings.gradle MediaServiceCore/core_settings.gradle MediaServiceCore/SharedModules/core_settings.gradle
